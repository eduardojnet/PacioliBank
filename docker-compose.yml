# Ambiente local completo. RNF-037: um comando, maquina limpa, sem passo manual.
#   docker compose up --build
#
# O nome do projeto e fixo, e nao herdado do nome da pasta: duas copias do
# repositorio em pastas diferentes passariam a ser dois projetos distintos, e
# os container_name fixos abaixo colidiriam entre eles.
name: pacioli-bank-ledger

services:

  pacioli-db:
    image: postgres:17-alpine
    container_name: pacioli-db
    environment:
      POSTGRES_DB: pacioli
      POSTGRES_USER: pacioli_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pacioli_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pacioli-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacioli_migrator -d pacioli"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pacioli-net

  # Aplica as migracoes pendentes e termina (ADR-0002). E o unico processo
  # com a credencial de migracao; a API sobe depois, com o papel que so le e
  # insere (ADR-0009). Subir de novo sobre o mesmo volume nao reaplica nada.
  pacioli-migrations:
    build:
      context: .
      dockerfile: src/PacioliBank.Migrations/Dockerfile
    image: pacioli-bank/migrations:local
    container_name: pacioli-migrations
    depends_on:
      pacioli-db:
        condition: service_healthy
    environment:
      # GSS Encryption Mode=Disable: sem Kerberos no ambiente local; sem isso,
      # o Npgsql tenta carregar libgssapi, ausente na imagem, e o sistema
      # escreve um aviso em texto livre no meio do log JSON (card 33).
      ConnectionStrings__Migrator: "Host=pacioli-db;Port=5432;Database=pacioli;Username=pacioli_migrator;Password=${POSTGRES_PASSWORD:-pacioli_local_dev};GSS Encryption Mode=Disable"
      # Contas de exemplo do README e do painel. So no ambiente local.
      PACIOLI_SEED_LOCAL: "true"
    restart: "no"
    networks:
      - pacioli-net

  # Painel de observabilidade (ADR-0012, card 33.1): recebe tracos e metricas
  # por OTLP e os mostra em http://localhost:18888. Somente ambiente local:
  # autenticacao desligada de proposito, e nada aqui e dado de producao.
  pacioli-observability:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0
    container_name: pacioli-observability
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"
    networks:
      - pacioli-net

  pacioli-api:
    build:
      context: .
      dockerfile: src/PacioliBank.Api/Dockerfile
    image: pacioli-bank/ledger:local
    container_name: pacioli-api
    depends_on:
      pacioli-migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Ledger: "Host=pacioli-db;Port=5432;Database=pacioli;Username=pacioli_runtime;Password=${POSTGRES_PASSWORD:-pacioli_local_dev};GSS Encryption Mode=Disable"
      # Tracos e metricas por OTLP para o painel. Sem esta variavel, nada e exportado.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://pacioli-observability:18889
      # Metricas a cada 10 s no painel local; o padrao do OpenTelemetry e 60 s.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    ports:
      - "8080:8080"
    networks:
      - pacioli-net

networks:
  pacioli-net:
    name: pacioli-net

volumes:
  pacioli-data:
    name: pacioli-data
